security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_home
            logout:
                path: app_logout
                target: app_home
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800 # 7 jours
                path: /
            # 5 essais ratés maximum, puis blocage pendant 15 minutes
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

    # Chaque compte a un seul rôle métier (ROLE_CLIENT, ROLE_HAIRDRESSER ou ROLE_ADMIN).
    # ROLE_USER est ajouté automatiquement par User::getRoles().
    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/coiffeur, roles: ROLE_HAIRDRESSER }
        - { path: ^/mon-compte, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10